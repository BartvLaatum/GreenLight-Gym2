[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gl_gym"
version = "0.2.0"
description = "GreenLight-Gym environment with Python-native models"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Bart van Laatum" }]
keywords = ["reinforcement-learning", "greenhouse", "control", "gymnasium"]
dependencies = [
  "casadi==3.6.7",
  "numpy<2.0",
  "scipy>=1.4.1",
  "pandas>=1.0.1",
  "geopy>=2.4.1",
  "gymnasium==0.29.1",
  "matplotlib>=3.1.3",
  "torch==1.13.0+cu116",
  "tqdm==4.67.1",
  "wandb==0.19.11",  # if you keep W&B hooks in the repo
  "PyYAML>=6.0.2",
  "requests>=2.32.4",
  "stable-baselines3==2.1.0",  # if used by RL scripts
  "sb3_contrib==2.1.0",
  "timezonefinder>=8.0.0",
  "pytz>=2019.3",
  "setuptools>=45.2.0",
  "tensorboard==2.18.0",
]

[project.urls]
Homepage = "https://github.com/BartvLaatum/GreenLight-Gym2"
Documentation = "https://github.com/BartvLaatum/GreenLight-Gym2#readme"
Changelog = "https://github.com/BartvLaatum/GreenLight-Gym2/releases"

[tool.setuptools.packages.find]
where = ["."]
include = ["gl_gym*"]
